<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2d2d2d" />
  <meta name="description" content="Diseñador de patrones para telar de peine" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TelarPaint</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header id="topbar">
      <div id="topbar-left">
        <button id="btn-menu" class="icon-btn" title="Menú" aria-label="Menú">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span id="pattern-title-display" class="title-text">Sin título</span>
      </div>
      <div id="topbar-center">
        <button id="btn-sym-h" class="icon-btn" title="Simetría horizontal (columna central)" aria-label="Simetría horizontal (columna central)">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M8 8l-4 4 4 4M16 8l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="btn-sym-v" class="icon-btn" title="Simetría vertical (fila central)" aria-label="Simetría vertical (fila central)">
          <svg viewBox="0 0 24 24"><path d="M3 12h18M8 8l4-4 4 4M8 16l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
      <div id="topbar-right">
        <button id="btn-undo" class="icon-btn" title="Deshacer" aria-label="Deshacer" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a6 6 0 010 12h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Rehacer" aria-label="Rehacer" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M19 9H8a6 6 0 000 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="btn-instructions" class="icon-btn" title="Ver instrucciones" aria-label="Ver instrucciones">
          <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6M9 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </header>

    <!-- Toolbar (left side) -->
    <aside id="toolbar">
      <div id="tool-buttons"></div>
      <div id="color-section">
        <div class="color-pair">
          <label class="color-swatch-label" title="Color A (arriba)">
            <input type="color" id="color-a-picker" value="#1a1a2e" aria-label="Color A - hilo arriba" />
            <span class="color-swatch" id="color-a-swatch"></span>
            <span class="color-label">A</span>
          </label>
          <label class="color-swatch-label" title="Color B (abajo)">
            <input type="color" id="color-b-picker" value="#e8d5b7" aria-label="Color B - hilo abajo" />
            <span class="color-swatch" id="color-b-swatch"></span>
            <span class="color-label">B</span>
          </label>
        </div>
        <button id="btn-swap-colors" class="icon-btn small" title="Intercambiar colores" aria-label="Intercambiar colores">
          <svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
      <div id="zoom-section">
        <button id="btn-zoom-in" class="icon-btn small" title="Acercar" aria-label="Acercar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-zoom-out" class="icon-btn small" title="Alejar" aria-label="Alejar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-zoom-reset" class="icon-btn small" title="Restablecer zoom" aria-label="Restablecer zoom">
          <svg viewBox="0 0 24 24"><path d="M4 4h6M4 4v6M20 20h-6M20 20v-6M4 20v-6M4 20h6M20 4h-6M20 4v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main canvas area -->
    <main id="canvas-container">
      <div id="canvas-viewport">
        <div id="pattern-grid" role="grid" aria-label="Cuadrícula de patrón">
          <div id="sym-guide-v" class="sym-guide-v hidden" aria-hidden="true"></div>
          <div id="sym-guide-h" class="sym-guide-h hidden" aria-hidden="true"></div>
          <div id="paste-preview-box" class="paste-preview-box hidden" aria-hidden="true"></div>
        </div>
      </div>
      <div id="selection-bar" class="selection-bar hidden" role="toolbar" aria-label="Acciones de selección">
        <button id="btn-copy-selection" class="sel-bar-btn" title="Copiar selección">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>Copiar</span>
        </button>
        <button id="btn-paste-selection" class="sel-bar-btn" title="Pegar selección" disabled>
          <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>Pegar</span>
        </button>
        <button id="btn-clear-selection" class="sel-bar-btn close-btn" title="Deseleccionar">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </main>

    <!-- Side drawer (menu) -->
    <div id="drawer-overlay" class="hidden" aria-hidden="true"></div>
    <nav id="drawer" class="hidden" aria-label="Menú principal">
      <div id="drawer-header">
        <h2>TelarPaint</h2>
        <button id="btn-close-drawer" class="icon-btn" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="drawer-content">
        <section class="drawer-section">
          <h3>Patrón</h3>
          <div class="form-row">
            <label for="input-title">Título</label>
            <input type="text" id="input-title" placeholder="Nombre del patrón" maxlength="80" />
          </div>
          <div class="form-row">
            <label for="input-cols">Ancho (columnas)</label>
            <input type="number" id="input-cols" min="1" max="200" value="20" />
          </div>
          <div class="form-row">
            <label for="input-rows">Alto inicial (filas)</label>
            <input type="number" id="input-rows" min="1" max="500" value="20" />
          </div>
          <button id="btn-new-pattern" class="action-btn primary">Nuevo patrón</button>
        </section>
        <section class="drawer-section">
          <h3>Proyectos guardados</h3>
          <div id="saved-patterns-list"></div>
          <button id="btn-save" class="action-btn">Guardar</button>
        </section>
        <section class="drawer-section">
          <h3>Exportar</h3>
          <button id="btn-export-pdf" class="action-btn">Exportar PDF</button>
        </section>
      </div>
    </nav>

    <!-- Instructions panel -->
    <div id="instructions-overlay" class="hidden" aria-hidden="true"></div>
    <aside id="instructions-panel" class="hidden" aria-label="Instrucciones de tejido">
      <div id="instructions-header">
        <h2>Instrucciones</h2>
        <button id="btn-close-instructions" class="icon-btn" aria-label="Cerrar instrucciones">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="instructions-content"></div>
    </aside>

    <!-- Toast notification -->
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
